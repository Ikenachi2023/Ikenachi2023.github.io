<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>非公開ページ - いけなちのホームページ</title>
<style>
  :root {
    --bg: #09090c;
    --surface: #131318;
    --border: rgba(255, 255, 255, 0.08);
    --text-primary: #ffffff;
    --text-secondary: #9da0aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
  }
  p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
  }
  a {
    margin-top: 8px;
    display: inline-block;
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 9999px;
    border: 1px solid var(--border);
  }
  a:hover {
    background: rgba(255, 255, 255, 0.06);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 現在このページは非公開です</h1>
    <p>コンテンツ見直しのため、公開を停止しております。</p>
    <a href="index.html">← ホームへ戻る</a>
  </div>
</body>
</html>
